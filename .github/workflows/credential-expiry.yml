name: Credential expiry check

# Once a day, asks the credential-expiry-reminder edge function to look at
# public.credential_expirations. The function emails support@skyspath.com
# once when a credential (today: the Microsoft sign-in client secret) is 30
# days or fewer from expiring. A failed run here means the check itself is
# broken, and GitHub emails the repo owner about it.
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 8 or 9 am in Montana
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the reminder check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$SUPABASE_URL/functions/v1/credential-expiry-reminder" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
