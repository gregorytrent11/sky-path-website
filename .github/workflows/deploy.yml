name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Dogs are published/edited straight from the live admin UI, not through
  # a commit -- new dogs only get their own pretty static URL after a
  # rebuild (see app/(public)/dogs/[slug]/page.tsx). The admin panel now
  # triggers an immediate rebuild via the trigger-deploy Edge Function on
  # publish/hide/delete, so this periodic run is just a safety net for
  # anything that slips past that (failed trigger, direct DB edit, etc.).
  # The /dogs listing itself is always live regardless.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer trigger (e.g. several admin edits in a row) supersedes an
  # older queued/running build rather than piling up redundant runs --
  # only the latest content matters for a rebuild.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_DONATION_URL: ${{ vars.NEXT_PUBLIC_DONATION_URL }}
          # Optional: Google Search Console HTML-tag verification token
          # (see app/layout.tsx). Set as a repository variable once you claim
          # the property in Search Console.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
